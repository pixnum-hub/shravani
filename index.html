<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" id="themeColorMeta" content="#12141c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shravani">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Shravani — FM Radio</title>
<style>
:root{--bg:#12141c; --surface:#1b1e29; --surface2:#232636; --text:#eceefb; --muted:#9096ad; --accent:#7c9eff; --border:#2b2f42; --danger:#ff6b6b;}
[data-theme="light"]{--bg:#f4f5fa; --surface:#ffffff; --surface2:#eceffb; --text:#1a1c26; --muted:#666c80; --accent:#3b5bdb; --border:#dde0ec;}
[data-theme="oled"]{--bg:#000000; --surface:#0a0a0a; --surface2:#131313; --text:#f0f0f0; --muted:#888888; --accent:#00d4ff; --border:#1c1c1c;}
[data-theme="hc"]{--bg:#000000; --surface:#000000; --surface2:#000000; --text:#ffffff; --muted:#ffffff; --accent:#ffff00; --border:#ffffff;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; display:flex; flex-direction:column; min-height:100vh;}
[data-theme="hc"] *{border-color:#fff !important;}
.app{flex:1; display:flex; flex-direction:column; max-width:640px; width:100%; margin:0 auto; padding:0 12px;}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 2px 8px;}
.topbar h1{font-size:1.25rem; margin:0; letter-spacing:.5px;}
.theme-toggle{display:flex; gap:6px;}
.theme-toggle button{background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; width:34px; height:34px; font-size:1rem; cursor:pointer;}
.theme-toggle button.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.search-row{display:flex; gap:8px; margin:6px 2px 10px;}
.search-row input{flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:.95rem; min-width:0;}
.search-row button{background:var(--accent); color:#0b0c12; border:none; border-radius:10px; padding:0 16px; font-size:1rem; cursor:pointer; font-weight:600;}
.tabs{display:flex; gap:6px; margin:0 2px 8px;}
.tab{flex:1; padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; font-size:.85rem; font-weight:600;}
.tab.active{color:var(--bg); background:var(--accent); border-color:var(--accent);}
[data-theme="hc"] .tab.active{color:#000;}
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:7px 12px; border-radius:20px; font-size:.82rem; cursor:pointer; white-space:nowrap;}
.chip:active{border-color:var(--accent);}
.chip.pinned{border-color:var(--accent);}
.icon-btn{background:var(--surface); border:1px solid var(--border); color:var(--muted); border-radius:8px; width:38px; height:36px; font-size:1rem; cursor:pointer; flex:none;}
.icon-btn.on{color:var(--accent); border-color:var(--accent);}
.conn-badge{flex:none; display:flex; align-items:center; justify-content:center; width:38px; border:1px solid var(--border); border-radius:10px; background:var(--surface); font-size:1rem;}
#toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--surface2); color:var(--text); border:1px solid var(--border); padding:8px 16px; border-radius:20px; font-size:.78rem; opacity:0; pointer-events:none; transition:opacity .25s; z-index:50; max-width:88%; text-align:center;}
#toast.show{opacity:1;}
.station-card.previewing{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset;}
.station-list.compact .station-card{padding:6px 10px; gap:8px; margin-bottom:5px;}
.station-list.compact .station-icon{width:28px; height:28px; font-size:.9rem;}
.station-list.compact .station-name{font-size:.85rem;}
.station-list.compact .station-sub{display:none;}
.station-list{flex:1; overflow-y:auto; padding:2px 2px 130px; min-height:200px;}
.loading,.empty{color:var(--muted); text-align:center; padding:40px 10px; font-size:.9rem;}
.station-card{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:8px; cursor:pointer;}
.station-card:active{border-color:var(--accent);}
.station-icon{width:42px; height:42px; border-radius:8px; background:var(--surface2); flex:none; display:flex; align-items:center; justify-content:center; font-size:1.3rem; overflow:hidden;}
.station-icon img{width:100%; height:100%; object-fit:cover;}
.station-meta{flex:1; min-width:0;}
.station-name{font-size:.92rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.station-sub{font-size:.78rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.fav-mini{background:none; border:none; color:var(--accent); font-size:1.2rem; cursor:pointer; flex:none; padding:4px;}
.player-bar{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--border); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:none; align-items:center; gap:12px; max-width:640px; margin:0 auto;}
.player-bar.active{display:flex;}
.np-info{flex:1; min-width:0;}
.np-name{font-size:.92rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.np-sub{font-size:.75rem; color:var(--muted); display:flex; align-items:center; gap:6px;}
.bars{display:flex; gap:2px; align-items:flex-end; height:10px;}
.bars span{width:2px; background:var(--accent); animation:bounce 0.9s infinite ease-in-out;}
.bars span:nth-child(2){animation-delay:.2s;} .bars span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,100%{height:3px;}50%{height:10px;}}
.player-bar:not(.playing) .bars span{animation-play-state:paused; height:3px;}
.np-controls{display:flex; align-items:center; gap:10px; flex:none;}
.np-controls button{background:var(--surface2); border:1px solid var(--border); color:var(--text); width:38px; height:38px; border-radius:50%; font-size:1rem; cursor:pointer;}
#volumeSlider{width:70px; accent-color:var(--accent);}
#recordBtn.recording{background:var(--danger); color:#fff; animation:pulseRec 1s infinite;}
@keyframes pulseRec{0%,100%{opacity:1;}50%{opacity:.55;}}
footer.footer{border-top:1px solid var(--border); padding:14px 10px calc(14px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--muted); font-size:.75rem; max-width:640px; margin:0 auto; width:100%;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>📻 Shravani</h1>
    <div class="theme-toggle" id="themeToggle">
      <button data-theme-btn="dark" title="Dark">🌙</button>
      <button data-theme-btn="light" title="Light">☀️</button>
      <button data-theme-btn="oled" title="OLED">⚫</button>
      <button data-theme-btn="hc" title="High Contrast">◐</button>
    </div>
  </div>

  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Search station, city, genre...">
    <span class="conn-badge" id="connBadge" title="Connection">📶</span>
    <button id="searchBtn">Go</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="browse">Browse</button>
    <button class="tab" data-tab="favorites">★ Favorites</button>
    <button class="icon-btn" id="viewToggle" title="Toggle view">☰</button>
  </div>

  <div class="chips" id="chips"></div>
  <div class="chips" id="moods"></div>
  <div class="station-list" id="stationList"><div class="loading">Loading stations…</div></div>
</div>

<div class="player-bar" id="playerBar">
  <div class="np-info">
    <div class="np-name" id="npName">Select a station</div>
    <div class="np-sub"><span class="bars"><span></span><span></span><span></span></span><span id="npSub">—</span></div>
  </div>
  <div class="np-controls">
    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
    <button id="favBtn">☆</button>
    <button id="recordBtn" title="Record">⏺</button>
    <button id="playBtn">▶</button>
  </div>
</div>

<footer class="footer">
  <div id="copyright">© Manik Roy 2026. All Rights Reserved.</div>
</footer>

<audio id="audio" preload="none"></audio>
<audio id="previewAudio" preload="none"></audio>
<audio id="recAudio" preload="none" crossorigin="anonymous" muted></audio>

<script>
const SERVERS = [
  'https://de1.api.radio-browser.info','https://at1.api.radio-browser.info',
  'https://nl1.api.radio-browser.info','https://fr1.api.radio-browser.info'
];
const CHIPS = [
  {label:'📍 Local FM', type:'local', value:null}, {label:'🇮🇳 India', type:'country', value:'India'},
  {label:'🎵 Pop', type:'tag', value:'pop'}, {label:'🎸 Rock', type:'tag', value:'rock'}, {label:'🎻 Classical', type:'tag', value:'classical'},
  {label:'📰 News', type:'tag', value:'news'}, {label:'🕉 Devotional', type:'tag', value:'devotional'}, {label:'🎧 Electronic', type:'tag', value:'electronic'},
  {label:'🎙 Talk', type:'tag', value:'talk'}, {label:'🎷 Jazz', type:'tag', value:'jazz'}, {label:'🎤 Hip Hop', type:'tag', value:'hiphop'},
  {label:'💃 R&B', type:'tag', value:'rnb'}, {label:'🌴 Reggae', type:'tag', value:'reggae'}, {label:'🤠 Country', type:'tag', value:'country'},
  {label:'🤘 Metal', type:'tag', value:'metal'}, {label:'🎺 Blues', type:'tag', value:'blues'}, {label:'🕺 Dance', type:'tag', value:'dance'},
  {label:'🎨 Indie', type:'tag', value:'indie'}, {label:'🪕 Folk', type:'tag', value:'folk'}, {label:'🎬 Bollywood', type:'tag', value:'bollywood'},
  {label:'⚽ Sports', type:'tag', value:'sports'}, {label:'😂 Comedy', type:'tag', value:'comedy'}, {label:'🧸 Kids', type:'tag', value:'kids'},
  {label:'🛋 Chillout', type:'tag', value:'chillout'}, {label:'🇺🇸 USA', type:'country', value:'United States'}, {label:'🇬🇧 UK', type:'country', value:'United Kingdom'},
  {label:'🇯🇵 Japan', type:'country', value:'Japan'}, {label:'🇨🇳 China', type:'country', value:'China'},
];
const MOODS = [
  {label:'🌅 Morning', tags:['pop','news']}, {label:'🎯 Focus', tags:['instrumental','ambient']},
  {label:'🚗 Commute', tags:['news','talk']}, {label:'😴 Sleep', tags:['chillout','ambient']},
];
const $ = (id)=>document.getElementById(id);
const stationList=$('stationList'), searchInput=$('searchInput'), playerBar=$('playerBar');
const npName=$('npName'), npSub=$('npSub'), playBtn=$('playBtn'), favBtn=$('favBtn');
const audio=$('audio'), volumeSlider=$('volumeSlider'), recordBtn=$('recordBtn');
let allStations=[], favorites=JSON.parse(localStorage.getItem('shravani_favorites_v1')||'[]');
let currentTab='browse', currentStation=null, mediaRecorder=null, recChunks=[];

function vibrate(ms){ if(navigator.vibrate) navigator.vibrate(ms); }
function attachLongPress(el, onLongPress, delay=500){
  let timer=null;
  el.addEventListener('pointerdown', ()=>{ timer=setTimeout(()=>{el.dataset.suppress='1'; onLongPress();}, delay); });
  const cancel=()=>{ if(timer) clearTimeout(timer); };
  el.addEventListener('pointerup', cancel);
  el.addEventListener('pointerleave', cancel);
  el.addEventListener('pointercancel', cancel);
}
function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm=setTimeout(()=>t.classList.remove('show'), 3000);
}
function getConn(){ return navigator.connection || navigator.mozConnection || navigator.webkitConnection || null; }
function renderConnBadge(){
  const c=getConn(), badge=$('connBadge');
  const cellular = c && (c.type==='cellular' || (!c.type && /2g|3g|4g/.test(c.effectiveType||'')));
  badge.textContent = cellular ? '📱' : '📶';
  badge.title = cellular ? 'On cellular data' : (c ? 'On Wi-Fi' : 'Connection status unavailable');
}
renderConnBadge();
if(getConn()) getConn().addEventListener('change', renderConnBadge);

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function isFav(uuid){return favorites.some(f=>f.stationuuid===uuid);}
function saveFavs(){localStorage.setItem('shravani_favorites_v1', JSON.stringify(favorites));}
function toggleFavorite(st){
  if(isFav(st.stationuuid)){favorites=favorites.filter(f=>f.stationuuid!==st.stationuuid);}
  else{favorites.push({stationuuid:st.stationuuid,name:st.name,country:st.country,tags:st.tags,favicon:st.favicon,url_resolved:st.url_resolved||st.url});}
  saveFavs();
}

async function apiGet(path){
  for(const base of SERVERS){
    try{ const res=await fetch(base+path); if(res.ok) return await res.json(); }catch(e){}
  }
  throw new Error('offline');
}

function dedupeStations(list){
  const seen=new Set(), out=[];
  for(const st of list){
    const key=(st.url_resolved||st.url||'').replace(/\/+$/,'').toLowerCase() || (st.name||'').trim().toLowerCase();
    if(seen.has(key)) continue;
    seen.add(key); out.push(st);
  }
  return out;
}

const previewAudio=$('previewAudio');
function attachPreview(card, st){
  let timer=null, active=false;
  card.addEventListener('pointerdown', ()=>{
    timer=setTimeout(()=>{
      active=true; card.classList.add('previewing'); card.dataset.suppress='1'; vibrate(10);
      previewAudio.src=st.url_resolved||st.url; previewAudio.volume=0.7; previewAudio.play().catch(()=>{});
    }, 450);
  });
  const stop=()=>{
    if(timer) clearTimeout(timer);
    if(active){ active=false; card.classList.remove('previewing'); previewAudio.pause(); previewAudio.removeAttribute('src'); }
  };
  card.addEventListener('pointerup', stop);
  card.addEventListener('pointerleave', stop);
  card.addEventListener('pointercancel', stop);
}
function renderStations(list, container){
  container.innerHTML='';
  if(!list.length){container.innerHTML='<div class="empty">No stations found here.</div>'; return;}
  list.forEach(st=>{
    const div=document.createElement('div'); div.className='station-card'; div.title='Tap to play • Hold to preview';
    const tag=(st.tags||'').split(',')[0]||'';
    const rate=st.bitrate?st.bitrate+'kbps':'';
    div.innerHTML=`
      <div class="station-icon">${st.favicon?`<img src="${st.favicon}" onerror="this.parentElement.textContent='📻'">`:'📻'}</div>
      <div class="station-meta">
        <div class="station-name">${escapeHtml(st.name)}</div>
        <div class="station-sub">${escapeHtml(st.country||'')}${tag?' • '+escapeHtml(tag):''}${rate?' • '+rate:''}</div>
      </div>
      <button class="fav-mini">${isFav(st.stationuuid)?'★':'☆'}</button>`;
    div.querySelector('.fav-mini').addEventListener('click',(e)=>{e.stopPropagation(); toggleFavorite(st); renderCurrentView();});
    attachPreview(div, st);
    div.addEventListener('click',()=>{ if(div.dataset.suppress==='1'){div.dataset.suppress='0'; return;} playStation(st); });
    container.appendChild(div);
  });
}
function renderCurrentView(){
  renderStations(currentTab==='favorites'?favorites:allStations, stationList);
}

function setPlayingUI(isPlaying){
  playBtn.textContent = isPlaying?'⏸':'▶';
  playerBar.classList.toggle('playing', isPlaying);
}
function fadeAudio(target, duration, cb){
  const steps=10, stepTime=duration/steps, start=audio.volume, delta=(target-start)/steps;
  let i=0;
  const iv=setInterval(()=>{
    i++; audio.volume=Math.max(0,Math.min(1,start+delta*i));
    if(i>=steps){clearInterval(iv); if(cb) cb();}
  }, stepTime);
}
let retryCount=0, metaSeq=0;
function baseNpSub(st){
  const bits=[st.country||'Live'];
  if(st.bitrate) bits.push(st.bitrate+'kbps');
  if(st.codec) bits.push(st.codec);
  return bits.join(' • ');
}
async function fetchIcyMeta(url, seq){
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(), 4000);
    const res=await fetch(url, {headers:{'Icy-MetaData':'1'}, signal:ctrl.signal});
    const metaint=parseInt(res.headers.get('icy-metaint'));
    clearTimeout(timer);
    if(!metaint || !res.body) return;
    const reader=res.body.getReader();
    let buf=new Uint8Array(0);
    while(buf.length<metaint+256){
      const {value, done}=await reader.read();
      if(done) break;
      const merged=new Uint8Array(buf.length+value.length);
      merged.set(buf); merged.set(value, buf.length); buf=merged;
    }
    reader.cancel();
    const metaLen=buf[metaint]*16;
    if(!metaLen || seq!==metaSeq) return;
    const str=new TextDecoder().decode(buf.slice(metaint+1, metaint+1+metaLen));
    const match=str.match(/StreamTitle='([^']*)'/);
    if(match && match[1] && seq===metaSeq) npSub.textContent=match[1];
  }catch(e){}
}
function playStation(st){
  const url=st.url_resolved||st.url;
  const seq=++metaSeq;
  const switchNow=()=>{
    if(mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop();
    currentStation=st; retryCount=0;
    audio.src=url;
    npName.textContent=st.name; npSub.textContent=baseNpSub(st);
    favBtn.textContent=isFav(st.stationuuid)?'★':'☆';
    playerBar.classList.add('active');
    const targetVol=parseFloat(volumeSlider.value);
    audio.volume=0;
    const c=getConn();
    if(c && c.type==='cellular' && !sessionStorage.getItem('shravani_data_warned')){
      showToast('Streaming over mobile data — charges may apply');
      sessionStorage.setItem('shravani_data_warned','1');
    }
    audio.play().then(()=>{setPlayingUI(true); fadeAudio(targetVol,300); fetchIcyMeta(url, seq);})
      .catch(()=>{npSub.textContent='Unable to play — try another station'; setPlayingUI(false);});
  };
  if(currentStation && !audio.paused){ fadeAudio(0,250,switchNow); } else { switchNow(); }
}
function cycleStation(dir){
  const list=currentTab==='favorites'?favorites:allStations;
  if(!list.length || !currentStation) return;
  let idx=list.findIndex(s=>s.stationuuid===currentStation.stationuuid);
  if(idx===-1) idx=0;
  playStation(list[(idx+dir+list.length)%list.length]);
}
let touchStartX=0;
playerBar.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;});
playerBar.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)>50) cycleStation(dx<0?1:-1);
});
playBtn.addEventListener('click',()=>{
  if(!currentStation) return;
  vibrate(15);
  if(audio.paused){audio.play().then(()=>setPlayingUI(true)).catch(()=>{});} else {audio.pause(); setPlayingUI(false);}
});
favBtn.addEventListener('click',()=>{
  if(!currentStation) return;
  vibrate(15);
  toggleFavorite(currentStation);
  favBtn.textContent=isFav(currentStation.stationuuid)?'★':'☆';
  if(currentTab==='favorites') renderCurrentView();
});
volumeSlider.addEventListener('input',()=>{audio.volume=parseFloat(volumeSlider.value);});
audio.volume=0.8;
audio.addEventListener('playing',()=>{retryCount=0; setPlayingUI(true);});
function handleDrop(){
  if(!currentStation) return;
  if(retryCount>=3){npSub.textContent='Stream unavailable — try another station'; setPlayingUI(false); return;}
  retryCount++;
  npSub.textContent=`Reconnecting… (${retryCount}/3)`;
  setTimeout(()=>{
    if(!currentStation) return;
    audio.src=currentStation.url_resolved||currentStation.url;
    audio.play().catch(()=>{});
  }, 1200*retryCount);
}
audio.addEventListener('stalled', handleDrop);
audio.addEventListener('error', handleDrop);

function toggleRecord(){
  if(mediaRecorder && mediaRecorder.state==='recording'){ mediaRecorder.stop(); return; }
  if(!currentStation){ showToast('Play a station first'); return; }
  if(!window.MediaRecorder){ showToast('Recording not supported on this browser'); return; }
  const recAudio=$('recAudio'), url=currentStation.url_resolved||currentStation.url;
  recAudio.src=url;
  recAudio.play().then(()=>{
    try{
      const stream=(recAudio.captureStream||recAudio.mozCaptureStream).call(recAudio);
      const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t))||'';
      mediaRecorder = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
      recChunks=[];
      mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recChunks.push(e.data); };
      mediaRecorder.onstop=()=>{
        recAudio.pause(); recAudio.removeAttribute('src');
        recordBtn.classList.remove('recording'); recordBtn.textContent='⏺'; recordBtn.title='Record';
        if(!recChunks.length){ showToast("This station can't be recorded (stream restrictions)"); return; }
        const blob=new Blob(recChunks,{type:mediaRecorder.mimeType||'audio/webm'});
        const ext=(mediaRecorder.mimeType||'').includes('ogg')?'ogg':'webm';
        const name=(currentStation.name||'shravani').replace(/[^a-z0-9]+/gi,'_')+'_'+Date.now()+'.'+ext;
        const dlUrl=URL.createObjectURL(blob);
        const a=document.createElement('a'); a.href=dlUrl; a.download=name; a.click();
        setTimeout(()=>URL.revokeObjectURL(dlUrl),4000);
        showToast('Recording saved: '+name);
      };
      mediaRecorder.start(); recordBtn.classList.add('recording'); recordBtn.textContent='⏹'; recordBtn.title='Recording — tap to stop'; vibrate(20);
    }catch(err){
      recAudio.pause(); recAudio.removeAttribute('src');
      showToast("This station can't be recorded (stream restrictions)");
    }
  }).catch(()=>showToast('Could not start recording for this station'));
}
recordBtn.addEventListener('click', toggleRecord);

async function loadLocal(){
  stationList.innerHTML='<div class="loading">Finding your local stations…</div>';
  try{
    const geo=await fetch('https://ipapi.co/json/').then(r=>r.json());
    const country=geo.country_name;
    if(!country) throw new Error('no country');
    await loadChip({type:'country', value:country});
  }catch(e){
    stationList.innerHTML='<div class="empty">Could not detect your location. Try a country chip instead.</div>';
  }
}
async function loadMood(mood){
  stationList.innerHTML=`<div class="loading">Curating your ${mood.label.split(' ')[1]} mix…</div>`;
  try{
    const results=await Promise.all(mood.tags.map(t=>
      apiGet(`/json/stations/bytag/${encodeURIComponent(t)}?limit=25&hidebroken=true&order=clickcount&reverse=true`).catch(()=>[])
    ));
    allStations=dedupeStations(results.flat());
    setActiveTab('browse'); renderCurrentView();
  }catch(e){stationList.innerHTML='<div class="empty">Could not load this mix.</div>';}
}
async function loadChip(chip){
  if(chip.type==='local'){ await loadLocal(); return; }
  stationList.innerHTML='<div class="loading">Loading…</div>';
  const base=chip.type==='tag'?'/json/stations/bytag/':'/json/stations/bycountry/';
  try{
    const data=await apiGet(`${base}${encodeURIComponent(chip.value)}?limit=40&hidebroken=true&order=clickcount&reverse=true`);
    allStations=dedupeStations(data); setActiveTab('browse'); renderCurrentView();
  }catch(e){stationList.innerHTML='<div class="empty">Could not reach radio directory. Check your connection.</div>';}
}
async function doSearch(){
  const q=searchInput.value.trim();
  if(!q){loadChip(CHIPS[1]); return;}
  stationList.innerHTML='<div class="loading">Searching…</div>';
  try{
    const data=await apiGet(`/json/stations/search?name=${encodeURIComponent(q)}&limit=40&hidebroken=true&order=clickcount&reverse=true`);
    allStations=dedupeStations(data); setActiveTab('browse'); renderCurrentView();
  }catch(e){stationList.innerHTML='<div class="empty">Search failed. Please try again.</div>';}
}
$('searchBtn').addEventListener('click',doSearch);
searchInput.addEventListener('keydown',(e)=>{if(e.key==='Enter') doSearch();});

function setActiveTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{setActiveTab(b.dataset.tab); renderCurrentView();}));

let pinnedChips=JSON.parse(localStorage.getItem('shravani_pinned_chips_v1')||'[]');
function updateChipLabel(b, chip){
  const pinned=pinnedChips.includes(chip.label);
  b.classList.toggle('pinned', pinned);
  b.textContent=(pinned?'📌 ':'')+chip.label;
}
function applyChipOrder(){
  [...chipsEl.children].forEach(b=>{
    const idx=pinnedChips.indexOf(b.dataset.label);
    b.style.order = idx>=0 ? idx : 100+CHIPS.findIndex(c=>c.label===b.dataset.label);
  });
}
function togglePinChip(label, btn, chip){
  pinnedChips = pinnedChips.includes(label) ? pinnedChips.filter(l=>l!==label) : [...pinnedChips, label];
  localStorage.setItem('shravani_pinned_chips_v1', JSON.stringify(pinnedChips));
  updateChipLabel(btn, chip); applyChipOrder();
}
const chipsEl=$('chips');
CHIPS.forEach(chip=>{
  const b=document.createElement('button'); b.className='chip'; b.dataset.label=chip.label;
  updateChipLabel(b, chip);
  attachLongPress(b, ()=>{ vibrate(20); togglePinChip(chip.label, b, chip); });
  b.addEventListener('click',()=>{ if(b.dataset.suppress==='1'){b.dataset.suppress='0'; return;} loadChip(chip); });
  chipsEl.appendChild(b);
});
applyChipOrder();
const moodsEl=$('moods');
MOODS.forEach(mood=>{
  const b=document.createElement('button'); b.className='chip'; b.textContent=mood.label;
  b.addEventListener('click',()=>loadMood(mood));
  moodsEl.appendChild(b);
});

let compactView = localStorage.getItem('shravani_view_v1')==='compact';
function applyView(){
  stationList.classList.toggle('compact', compactView);
  const vb=$('viewToggle');
  vb.textContent = compactView ? '▦' : '☰';
  vb.classList.toggle('on', compactView);
  vb.title = compactView ? 'Switch to card view' : 'Switch to compact view';
}
$('viewToggle').addEventListener('click',()=>{ compactView=!compactView; localStorage.setItem('shravani_view_v1', compactView?'compact':'card'); applyView(); });
applyView();

function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('shravani_theme_v1', t);
  document.querySelectorAll('[data-theme-btn]').forEach(b=>b.classList.toggle('active', b.dataset.themeBtn===t));
  requestAnimationFrame(()=>{
    const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    $('themeColorMeta').setAttribute('content', bg);
  });
}
document.querySelectorAll('[data-theme-btn]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.themeBtn)));
setTheme(localStorage.getItem('shravani_theme_v1')||'dark');

$('copyright').textContent = `© Manik Roy ${new Date().getFullYear()}. All Rights Reserved.`;

loadChip(CHIPS[1]);
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }

</script>
</body>
</html>
